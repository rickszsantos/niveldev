# Sobe o site + API (app) e o PostgreSQL (db) com um comando:
#   docker compose up -d --build
# As variáveis ${...} vêm do arquivo .env na raiz (copie de .env.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Defina DB_USER no arquivo .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      POSTGRES_DB: ${DB_NAME:?Defina DB_NAME no arquivo .env}
    volumes:
      - niveldev-db:/var/lib/postgresql/data   # os dados sobrevivem a "docker compose down"
    ports:
      # Só acessível pela sua própria máquina (útil p/ rodar o backend com "npm run dev" ou abrir um cliente SQL).
      # Se a porta 5432 já estiver em uso no seu PC, troque o primeiro número (ex.: 127.0.0.1:5433:5432).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy   # só inicia a API depois que o banco aceitar conexões
    environment:
      PORT: 5050
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      DB_HOST: db                    # nome do serviço acima: é assim que um contêiner acha o outro
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    ports:
      - "${APP_PORT:-5050}:5050"

volumes:
  niveldev-db:
