<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta — NívelDev</title>

  <link rel="icon" href="img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png">
  <link rel="apple-touch-icon" href="img/favicon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">

  <!-- style.css (cabeçalho) + cadastro.css (campos) + login.css (fundo azul e cartão no centro, igual ao login) -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cadastro.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-page">

  <a class="skip-link" href="#form-cadastro">Pular para o formulário</a>

  <main class="auth-layout auth-centro">

    <!-- ===================== FORMULÁRIO NO CENTRO ===================== -->
    <section class="auth-panel">
      <div class="auth-card auth-card--cadastro">

        

        <!-- Logo e nome em cima do formulário -->
        <a class="auth-logo" href="index.html" aria-label="NívelDev — voltar ao início">
          <img src="img/logo-niveldev.png" alt="NívelDev">
        </a>

        <header class="auth-header">
          <h1>Crie sua conta grátis</h1>
        </header>

        <!-- Mensagem geral do formulário (sucesso ou erro do servidor) -->
        <div class="form-alert" id="form-alert" role="alert" hidden></div>

        <form id="form-cadastro" class="auth-form" novalidate>

          <div class="field">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" autocomplete="name"
                   placeholder="Ex.: Maria Souza" maxlength="120" required
                   aria-describedby="nome-erro">
            <p class="field-error" id="nome-erro" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="email"
                   inputmode="email" placeholder="voce@email.com" maxlength="255" required
                   aria-describedby="email-erro">
            <p class="field-error" id="email-erro" aria-live="polite"></p>
          </div>

          <!-- Senha e confirmação lado a lado -->
          <div class="field-row">
          <div class="field">
            <label for="senha">Senha</label>
            <div class="input-group">
              <input type="password" id="senha" name="senha" autocomplete="new-password"
                     placeholder="Mínimo 8 caracteres" maxlength="72" required
                     aria-describedby="senha-erro">
              <button type="button" class="toggle-senha" data-alvo="senha"
                      aria-label="Mostrar senha" aria-pressed="false">Mostrar</button>
            </div>

            <!-- Medidor de força -->
            <div class="strength" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
            </div>
            <p class="strength-label" id="forca-texto" aria-live="polite"></p>
            <p class="field-error" id="senha-erro" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="confirmar">Confirme a senha</label>
            <div class="input-group">
              <input type="password" id="confirmar" name="confirmar" autocomplete="new-password"
                     placeholder="Repita a senha" maxlength="72" required
                     aria-describedby="confirmar-erro">
              <button type="button" class="toggle-senha" data-alvo="confirmar"
                      aria-label="Mostrar senha" aria-pressed="false">Mostrar</button>
            </div>
            <p class="field-error" id="confirmar-erro" aria-live="polite"></p>
          </div>
          </div>

          <button type="submit" class="btn-primary" id="btn-cadastrar">
            <span class="btn-text">Criar minha conta grátis</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>
        </form>

        <p class="auth-switch">
          Já tem uma conta? <a href="login.html">Entrar</a>
        </p>
      </div>
    </section>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
