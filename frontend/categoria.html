<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercícios de Programação — NívelDev</title>

  <link rel="icon" href="img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png">
  <link rel="apple-touch-icon" href="img/favicon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/categoria.css">
</head>
<body class="app-page">

  <div class="app-shell">

    <!-- ===================== MENU LATERAL (igual ao da home) ===================== -->
    <aside class="app-sidebar" id="app-sidebar" aria-label="Menu principal">
      <a href="home.html" class="app-logo" aria-label="NívelDev — início">
        <img src="img/logo-niveldev.png" alt="NívelDev">
      </a>

      <nav class="app-nav">
        <a href="home.html" class="app-nav-item">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1v-9z"/></svg>
          Início
        </a>
        <a href="home.html#cursos" class="app-nav-item">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5L2 9z"/><path d="M6 11.5V16c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.5"/><path d="M22 9v6"/></svg>
          Cursos
        </a>
        <a href="exercicios.html" class="app-nav-item is-active" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8l-4 4 4 4"/><path d="M16 8l4 4-4 4"/><path d="M13.5 5l-3 14"/></svg>
          Exercícios
        </a>
        <a href="home.html#progresso" class="app-nav-item">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="13" width="4" height="7" rx="1.5"/><rect x="10" y="8" width="4" height="12" rx="1.5"/><rect x="17" y="3" width="4" height="17" rx="1.5"/></svg>
          Meu Progresso
        </a>

        <hr class="app-nav-sep">

        <a href="home.html#perfil" class="app-nav-item">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
          Meu Perfil
        </a>
      </nav>
    </aside>
    <div class="app-backdrop" id="app-backdrop" hidden></div>

    <!-- ===================== ÁREA PRINCIPAL ===================== -->
    <div class="app-main">

      <header class="app-topbar">
        <button type="button" class="app-menu-btn" id="app-menu-btn" aria-label="Abrir menu" aria-controls="app-sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>

        <div class="app-user">
          <button type="button" class="app-user-btn" id="app-user-btn" aria-haspopup="true" aria-expanded="false" aria-label="Menu do usuário">
            <span class="app-avatar" id="app-avatar">…</span>
            <svg class="app-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="app-user-menu" id="app-user-menu" hidden>
            <p class="app-user-nome" id="app-user-nome"></p>
            <a href="home.html#perfil" class="app-user-item">Meu Perfil</a>
            <button type="button" class="app-user-item" id="btn-sair">Sair</button>
          </div>
        </div>
      </header>

      <main class="app-content" id="app-content" tabindex="-1">

        <a href="exercicios.html" class="cat-voltar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
          Voltar para categorias
        </a>

        <div class="cat-head">
          <div class="app-hero">
            <h1 id="cat-titulo">Exercícios de Programação</h1>
            <p>Pratique Python com exercícios práticos e desafiadores.</p>
            <span class="app-hero-traco" aria-hidden="true"></span>
          </div>

          <div class="cat-filtros">
            <label class="cat-search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
              <input type="search" id="cat-busca" placeholder="Pesquisar exercícios..." autocomplete="off" aria-label="Pesquisar exercícios">
            </label>
          </div>
        </div>

        <section class="app-card cat-tabela" aria-label="Lista de exercícios">
          <div class="cat-cabecalho" aria-hidden="true">
            <span>Título</span>
            <span>Dificuldade</span>
            <span></span>
          </div>

          <ul class="cat-lista" id="cat-lista"></ul>

          <p class="cat-vazio" id="cat-vazio" hidden>Nenhum exercício encontrado.</p>
        </section>

        <p class="cat-contador" id="cat-contador"></p>

      </main>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/categoria.js"></script>
</body>
</html>
