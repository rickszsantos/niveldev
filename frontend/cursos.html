<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursos — NívelDev</title>

  <link rel="icon" href="img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png">
  <link rel="apple-touch-icon" href="img/favicon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

  <script src="js/preferencias.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app-base.css">
  <link rel="stylesheet" href="css/cursos.css">
</head>
<body class="app-page" data-pagina="cursos">

  <div class="app-shell">

    <!-- menu lateral e topo são montados por js/layout.js -->
    <div data-layout="menu"></div>

    <div class="app-main">
      <div data-layout="topo"></div>

      <main class="app-content" id="app-content" tabindex="-1">

        <div class="app-hero">
          <h1>Cursos</h1>
          <p>Aprenda no seu ritmo e evolua na programação.</p>
          <span class="app-hero-traco" aria-hidden="true"></span>
        </div>

        <!-- Banner -->
        <section class="cr-banner" aria-labelledby="cr-banner-titulo">
          <div class="cr-banner-texto">
            <h2 id="cr-banner-titulo">Seu próximo nível<br>começa aqui!</h2>
            <p>Explore nossos cursos e desenvolva suas habilidades em programação.</p>
          </div>

          <svg class="cr-banner-arte" viewBox="0 0 420 230" aria-hidden="true" focusable="false">
            <path class="arte-morro" d="M20 214c46-58 126-40 196-66s96-36 170-6v88H20z"/>
            <path class="arte-faisca" d="M338 22l8 22M360 34l16 14M370 62l24-6"/>
            <g class="arte-livros">
              <rect x="300" y="92" width="104" height="20" rx="5" class="l1"/><rect x="312" y="97" width="84" height="6" rx="2" class="pg"/>
              <rect x="296" y="116" width="108" height="20" rx="5" class="l2"/><rect x="310" y="121" width="86" height="6" rx="2" class="pg"/>
              <rect x="304" y="140" width="100" height="20" rx="5" class="l1"/><rect x="316" y="145" width="80" height="6" rx="2" class="pg"/>
              <rect x="292" y="164" width="116" height="12" rx="4" class="l3"/>
            </g>
            <path class="arte-tela" d="M96 60L276 36l16 124-180 24z"/>
            <path class="arte-base" d="M108 184l180-24 30 14-176 26z"/>
            <path class="arte-codigo" d="M170 100l-20 18 20 18M224 92l20 18-20 18M206 86l-14 52" transform="rotate(-4 197 112)"/>
          </svg>
        </section>

        <!-- Cursos em destaque -->
        <section aria-labelledby="cr-dest-titulo">
          <div class="cr-sec-topo">
            <h2 class="cr-sec-titulo" id="cr-dest-titulo">
              <svg class="cr-sec-estrela" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 6 6.5.8-4.8 4.5 1.3 6.5L12 17.4l-5.8 3.2 1.3-6.5L2.7 9.6l6.5-.8L12 2.8z"/></svg>
              Cursos em Destaque
            </h2>
            <a href="#cr-mais-titulo" class="cr-ver-todos">
              Ver todos
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </a>
          </div>
          <ul class="cr-grade" id="cr-destaque"></ul>
        </section>

        <!-- Mais cursos -->
        <section aria-labelledby="cr-mais-titulo">
          <div class="cr-sec-topo">
            <h2 class="cr-sec-titulo" id="cr-mais-titulo" tabindex="-1">
              <svg class="cr-sec-grade" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="2.2"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="2.2"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="2.2"/><rect x="13" y="13" width="7.5" height="7.5" rx="2.2"/></svg>
              Mais Cursos
            </h2>
            <label class="cr-ordem">
              <select id="cr-ordem" aria-label="Ordenar cursos"></select>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </label>
          </div>
          <ul class="cr-grade" id="cr-mais" aria-live="polite"></ul>
        </section>

      </main>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/cursos.js"></script>
</body>
</html>
