<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursos — NívelDev</title>

  <link rel="icon" href="img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png">
  <link rel="apple-touch-icon" href="img/favicon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

  <script src="js/preferencias.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app-base.css">
  <link rel="stylesheet" href="css/cursos.css">
</head>
<body class="app-page" data-pagina="cursos">

  <div class="app-shell">

    <!-- menu lateral e topo são montados por js/layout.js -->
    <div data-layout="menu"></div>

    <div class="app-main">
      <div data-layout="topo"></div>

      <main class="app-content cr-content" id="app-content" tabindex="-1">

        <!-- Banner (carrossel) -->
        <section class="cr-hero" id="cr-hero" aria-roledescription="carrossel" aria-label="Destaques">
          <div class="cr-hero-texto">
            <h1 id="cr-hero-titulo">Aprenda, Pratique,<br><span>Evolua.</span></h1>
            <p id="cr-hero-sub">Cursos completos para você dominar<br>a tecnologia e impulsionar sua carreira.</p>
            <a href="#cr-destaque-titulo" class="cr-hero-btn" id="cr-hero-btn">
              Explorar cursos
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </a>
          </div>

          <svg class="cr-hero-arte" viewBox="0 0 460 280" aria-hidden="true" focusable="false">
            <path class="arte-onda" d="M0 230c80-70 170-30 250-70s120-60 210-30v150H0z"/>
            <path class="arte-faisca" d="M372 36l-8 24M396 52l-22 14M404 82l-28 2"/>
            <g class="arte-livros">
              <rect x="320" y="150" width="140" height="22" rx="4" class="l1"/><rect x="332" y="156" width="118" height="8" rx="2" class="pg"/>
              <rect x="316" y="176" width="144" height="22" rx="4" class="l2"/><rect x="328" y="182" width="122" height="8" rx="2" class="pg"/>
              <rect x="324" y="202" width="136" height="22" rx="4" class="l1"/><rect x="336" y="208" width="114" height="8" rx="2" class="pg"/>
            </g>
            <path class="arte-tela" d="M112 70L318 42l22 148-208 28z"/>
            <path class="arte-tela-int" d="M124 78l186-25 18 128-186 25z"/>
            <path class="arte-base" d="M122 214l208-28 26 16-204 30z"/>
            <text class="arte-n" x="222" y="152" text-anchor="middle">N</text>
          </svg>

          <div class="cr-hero-pontos" id="cr-hero-pontos" role="group" aria-label="Escolher destaque"></div>
        </section>

        <!-- Seções (cada uma é um carrossel horizontal) -->
        <div id="cr-secoes"></div>

      </main>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/cursos.js"></script>
</body>
</html>
