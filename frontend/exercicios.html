<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercícios — NívelDev</title>

  <link rel="icon" href="img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png">
  <link rel="apple-touch-icon" href="img/favicon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

  <script src="js/preferencias.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app-base.css">
  <link rel="stylesheet" href="css/exercicios.css">
</head>
<body class="app-page" data-pagina="exercicios">

  <div class="app-shell">

    <!-- menu lateral e topo são montados por js/layout.js -->
    <div data-layout="menu"></div>

    <div class="app-main">
      <div data-layout="topo"></div>

      <main class="app-content" id="app-content" tabindex="-1">

        <div class="ex-head">
          <div class="app-hero">
            <h1>Exercícios</h1>
            <p>Escolha uma categoria para ver os exercícios disponíveis.</p>
            <span class="app-hero-traco" aria-hidden="true"></span>
          </div>

          <div class="ex-ferramentas">
            <label class="ex-search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
              <input type="search" id="ex-busca" placeholder="Pesquisar categorias..." autocomplete="off" aria-label="Pesquisar categorias">
            </label>
            <!-- escolhe como as categorias aparecem: em blocos ou em lista -->
            <div class="ex-visao" role="group" aria-label="Modo de exibição">
              <button type="button" class="ex-visao-btn is-active" data-visao="blocos" aria-pressed="true" aria-label="Ver em blocos" title="Blocos">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
              </button>
              <button type="button" class="ex-visao-btn" data-visao="lista" aria-pressed="false" aria-label="Ver em lista" title="Lista">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 6.5H20M8.5 12H20M8.5 17.5H20"/><circle cx="4.5" cy="6.5" r=".6"/><circle cx="4.5" cy="12" r=".6"/><circle cx="4.5" cy="17.5" r=".6"/></svg>
              </button>
            </div>

          </div>
        </div>

        <section class="ex-grid" id="ex-grid" aria-live="polite"></section>

        <div class="estado-vazio" id="ex-vazio" hidden>
          <span class="estado-vazio-icone" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M8.5 11h5"/></svg></span>
          <strong>Nenhuma categoria encontrada</strong>
          <p>Tente buscar por outro termo, como “python” ou “listas”.</p>
        </div>

        <footer class="ex-rodape">
          <nav class="ex-paginacao" id="ex-paginacao" aria-label="Paginação"></nav>
          <span class="ex-contador" id="ex-contador"></span>
        </footer>

      </main>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/exercicios.js"></script>
</body>
</html>
