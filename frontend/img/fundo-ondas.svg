<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gSheet" gradientUnits="userSpaceOnUse" x1="0" y1="600" x2="0" y2="1000">
      <stop offset="0" stop-color="#7cc1ff"/>
      <stop offset="1" stop-color="#eef7ff"/>
    </linearGradient>
    <linearGradient id="gBand" gradientUnits="userSpaceOnUse" x1="0" y1="450" x2="1920" y2="650">
      <stop offset="0" stop-color="#1a78e8"/>
      <stop offset="0.5" stop-color="#2a93ff"/>
      <stop offset="1" stop-color="#2d9bff"/>
    </linearGradient>
    <linearGradient id="gDarkL" gradientUnits="userSpaceOnUse" x1="0" y1="500" x2="980" y2="580">
      <stop offset="0" stop-color="#0a4fc2"/>
      <stop offset="1" stop-color="#1366de"/>
    </linearGradient>
    <linearGradient id="gDarkR" gradientUnits="userSpaceOnUse" x1="880" y1="600" x2="1920" y2="400">
      <stop offset="0" stop-color="#0a55cf"/>
      <stop offset="0.5" stop-color="#05399c"/>
      <stop offset="1" stop-color="#03256f"/>
    </linearGradient>

    <!-- contorno da faixa principal -->
    <path id="faixa" d="M0 520 C140 470 300 450 470 455 C700 462 900 520 1100 560 C1300 595 1500 560 1650 430 C1760 335 1850 200 1920 60 L1920 430 C1760 520 1560 650 1380 665 C1180 680 1000 640 800 610 C600 580 420 600 280 665 C150 725 60 820 0 900 Z"/>
  </defs>

  <!-- fundo branco -->
  <rect width="1920" height="1080" fill="#ffffff"/>

  <!-- lençol claro de baixo, que esmaece até o branco -->
  <path d="M0 1000 C200 860 520 740 860 745 C1150 750 1450 880 1750 905 C1830 910 1880 905 1920 895 L1920 370 C1760 460 1560 590 1380 605 C1180 620 1000 580 800 550 C600 520 420 540 280 605 C150 665 60 760 0 840 Z" fill="url(#gSheet)"/>

  <!-- camadas finas empilhadas abaixo da faixa -->
  <use href="#faixa" transform="translate(0 46)" fill="#a6d5ff" opacity="0.9"/>
  <use href="#faixa" transform="translate(0 22)" fill="#59adff"/>

  <!-- faixa principal -->
  <use href="#faixa" fill="url(#gBand)"/>

  <!-- sombra escura à esquerda -->
  <path d="M0 545 C140 498 300 482 470 486 C640 492 800 525 980 575 C800 550 620 545 460 560 C300 580 120 660 0 760 Z" fill="url(#gDarkL)"/>

  <!-- massa escura à direita -->
  <path d="M880 605 C1050 640 1250 640 1450 560 C1620 490 1800 330 1920 170 L1920 430 C1760 520 1560 650 1380 665 C1200 680 1020 650 880 605 Z" fill="url(#gDarkR)"/>

  <!-- traços finos de luz -->
  <path d="M0 640 C150 560 320 540 470 548 C640 558 800 600 960 640" fill="none" stroke="#5db3ff" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <path d="M1100 590 C1300 625 1500 600 1660 480 C1770 390 1860 260 1920 140" fill="none" stroke="#1a78e8" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
  <path d="M1100 560 C1300 595 1500 560 1650 430 C1760 335 1850 200 1920 60" fill="none" stroke="#8fd0ff" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
</svg>
